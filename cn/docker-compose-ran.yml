version: '3.8'
services:
    oai-gnb:
        image: oaisoftwarealliance/oai-gnb:2023.w19
        privileged: true
        container_name: oai-gnb
        environment:
            USE_VOLUMED_CONF: 'yes' #Bonus I
            RFSIMULATOR: server
            USE_SA_TDD_MONO: 'yes'
            GNB_NAME: gnb-rfsim
            TAC: 1
            MCC: '001'
            MNC: '01'
            MNC_LENGTH: 2
            NSSAI_SST: 1
            AMF_IP_ADDRESS: 192.168.70.132
            GNB_NGA_IF_NAME: eth0
            GNB_NGA_IP_ADDRESS: 192.168.70.160
            GNB_NGU_IF_NAME: eth0
            GNB_NGU_IP_ADDRESS: 192.168.70.160
            SDR_ADDRS: serial=XXXXXXX
            USE_ADDITIONAL_OPTIONS: --sa -E --rfsim --log_config.global_log_options level,nocolor,time
        networks:
            public_net:
                ipv4_address: 192.168.70.160
        #Bonus I
        volumes:
            - ./conf/gnb.sa.bandn78.fr1.106PRB.rfsim.conf:/opt/oai-gnb/etc/mounted.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue:
        image: oaisoftwarealliance/oai-nr-ue:2023.w19
        privileged: true
        container_name: oai-nr-ue
        environment: 
            RFSIMULATOR: 192.168.70.160
            FULL_IMSI: '001010000000101'
            FULL_KEY: 'fec86ba6eb707ed08905757b1bb44b8f'
            OPC: 'C42449363BBAD02B66D16BC975D77CC1'
            DNN: oai
            NSSAI_SST: 1
            USE_ADDITIONAL_OPTIONS: -E --sa --rfsim -r 106 --numerology 1 -C 3619200000 --log_config.global_log_options level,nocolor,time
        networks:
            public_net:
                ipv4_address: 192.168.70.150
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue2:
        image: oaisoftwarealliance/oai-nr-ue:2023.w19
        privileged: true
        container_name: oai-nr-ue2
        environment: 
            USE_VOLUMED_CONF: 'yes' #Bonus I 
            RFSIMULATOR: 192.168.70.160
            FULL_IMSI: '001010000000102'
            FULL_KEY: 'fec86ba6eb707ed08905757b1bb44b8f'
            OPC: 'C42449363BBAD02B66D16BC975D77CC1'
            DNN: oai 
            NSSAI_SST: 1
            USE_ADDITIONAL_OPTIONS: -E --sa --rfsim -r 106 --numerology 1 -C 3619200000 --log_config.global_log_options level,nocolor,time
        ##Bonus I
        volumes:
            - ./conf/ue2.conf:/opt/oai-nr-ue/etc/mounted.conf
        networks:
            public_net:
                ipv4_address: 192.168.70.151
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    public_net:
        driver: bridge
        name: oaiworkshop
        ipam:
            config:
                - subnet: 192.168.70.128/26
        driver_opts:
            com.docker.network.bridge.name: "oaiworkshop"
